name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # release/** cubre los ajustes de una entrega que llegan por PR a su rama de release (GitFlow, T-05).
    branches: [ main, develop, 'release/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentsmart-back

    # Base de datos de test, igual al servicio db-test de docker-compose.yml.
    services:
      db-test:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # prisma.config.ts exige DATABASE_URL incluso para generar el cliente.
    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5433/testdb
      DATABASE_TEST_URL: postgresql://testuser:testpassword@localhost:5433/testdb
      # Solo para los tests del CI; no es un secreto real.
      JWT_SECRET: ci-test-secret-de-al-menos-32-caracteres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: rentsmart-back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Aplicar migraciones a la BD de test
        run: npx prisma migrate deploy

      - name: Lint (oxlint)
        run: npm run lint

      # Jest no genera coverage-summary.json por defecto; sin json-summary el resumen de abajo no muestra la tabla.
      - name: Unit tests y reporte de cobertura
        run: npm run test:cov -- --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      - name: Tests e2e (API con la BD de test)
        run: npm run test:e2e

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          echo "### 📊 Cobertura del Backend" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (v) => v.pct.toFixed(1) + '%';
              console.log('| Métrica | Cobertura |');
              console.log('|---|---|');
              console.log('| Sentencias | ' + fmt(s.statements) + ' |');
              console.log('| Ramas | ' + fmt(s.branches) + ' |');
              console.log('| Funciones | ' + fmt(s.functions) + ' |');
              console.log('| Líneas | ' + fmt(s.lines) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Reporte de cobertura generado en \`rentsmart-back/coverage/\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Subir artefacto de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: rentsmart-back/coverage/
          retention-days: 7

      - name: Build de producción
        run: npm run build

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentsmart-front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: rentsmart-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (si existen)
        run: npm test --if-present

      - name: Build de producción
        run: npm run build

  # Smoke test con navegador (F-10). Corre contra Vite con la API simulada por MSW (VITE_USE_MOCKS=true, ver
  # rentsmart-front/playwright.config.ts), así que no necesita el back ni la base de datos.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentsmart-front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: rentsmart-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test E2E (Playwright)
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            rentsmart-front/playwright-report/
            rentsmart-front/test-results/
          retention-days: 7
